<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ошибка сервера — СменаПринята</title>
<style>
  /* Автономная страница: inline CSS, без внешних ресурсов и скриптов. */
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f5f6f8; color: #1f2430;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px; box-sizing: border-box;
  }
  .card {
    max-width: 640px; background: #fff; border: 1px solid #e3e6ec;
    border-radius: 10px; padding: 40px 36px; box-shadow: 0 2px 10px rgba(20, 30, 55, .06);
  }
  h1 { font-size: 1.35rem; line-height: 1.45; margin: 0 0 24px; font-weight: 600; }
  .code { font-size: .75rem; color: #8a91a0; margin: 0 0 28px; letter-spacing: .03em; }
  a.home {
    display: inline-block; text-decoration: none;
    background: #2f6fed; color: #fff; border-radius: 8px;
    padding: 10px 22px; font-size: .95rem;
  }
  a.home:hover { background: #2559c4; }
</style>
</head>
<body>
  <main class="card">
    <h1>Ошибка сервера. Запись не сохранена. Если ошибка повторяется, передайте смену на бумаге и внесите записи позже</h1>
    <p class="code">UPSTREAM_DOWN</p>
    <a class="home" href="/">На главную</a>
  </main>

</html>
